name: Validate Windows ARM64 installer

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run that produced the installer and frontend artifacts
        required: true
      artifact_commit:
        description: Expected full source commit of that build
        required: true

permissions:
  contents: read
  actions: read

jobs:
  probes:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build current installed-runtime probes
        run: |
          ./scripts/Apply-TypeDuckSubmodulePatches.ps1
          foreach ($arch in 'Win32','x64','ARM64') {
            cmake -S Tests/InstalledRuntime -B "probe-$arch" -G 'Visual Studio 17 2022' -A $arch
            if ($LASTEXITCODE) { throw "Configure failed: $arch" }
            cmake --build "probe-$arch" --config Release
            if ($LASTEXITCODE) { throw "Probe build failed: $arch" }
            New-Item "current-probes/$arch" -ItemType Directory -Force | Out-Null
            Copy-Item "probe-$arch/Release/TypeDuckLoadProbe.exe" "current-probes/$arch"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Current-runtime-probes
          path: current-probes/
          if-no-files-found: error

  validate:
    needs: probes
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ARTIFACT_RUN_ID" -Headers @{Authorization="Bearer $env:GH_TOKEN"}
          if ($run.head_sha -ne $env:ARTIFACT_COMMIT) { throw 'Artifact source commit mismatch' }
          New-Item arm-validation -ItemType Directory -Force | Out-Null
          @{artifact_run=$run.html_url; artifact_commit=$run.head_sha; validation_commit=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content arm-validation/provenance.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: Current-runtime-probes
          path: current-probes
      - name: Use probes from the validation commit
        run: |
          Copy-Item current-probes/Win32/TypeDuckLoadProbe.exe artifacts/frontend-Win32/TypeDuckLoadProbe.exe
          Copy-Item current-probes/x64/TypeDuckLoadProbe.exe artifacts/frontend-x64/TypeDuckLoadProbe.exe
          Copy-Item current-probes/ARM64/TypeDuckLoadProbe.exe artifacts/frontend-ARM64X/ARM64-tests/TypeDuckLoadProbe.exe
          Get-ChildItem current-probes -Filter '*.exe' -Recurse | Get-FileHash | Format-Table | Out-File arm-validation/probe-hashes.txt
      - name: Test installed ARM64 runtime, upgrade and uninstall
        run: ./scripts/Test-TypeDuckArmInstall.ps1 -Artifacts "$PWD/artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-ARM64-validation
          path: arm-validation/
          if-no-files-found: error
