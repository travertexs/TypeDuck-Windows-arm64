name: Validate Windows ARM64 installer

on:
  push:
    branches: [windows-arm64]
    paths:
      - scripts/Test-TypeDuckArmInstall.ps1
      - .github/workflows/validate-arm64.yml
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run that produced the installer and frontend artifacts
        default: '41815221383'
        required: true
      artifact_commit:
        description: Expected full source commit of that build
        default: '72b22f459405251f175a9060ccb1188a3d5d7991'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  linker-check:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check ARM64X linker configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item linker-check -ItemType Directory | Out-Null
          'extern "C" __declspec(dllexport) int Probe() { return 42; }' | Set-Content linker-check/test.cpp
          "EXPORTS`nProbe" | Set-Content linker-check/MoqiTextService.def
          @'
          cmake_minimum_required(VERSION 3.21)
          project(LinkerCheck LANGUAGES CXX)
          set(CMAKE_MSVC_RUNTIME_LIBRARY MultiThreaded)
          add_library(MoqiTextService SHARED test.cpp MoqiTextService.def)
          include("../cmake/arm64x.cmake")
          '@ | Set-Content linker-check/CMakeLists.txt
          cmake -S linker-check -B linker-check/arm -G 'Visual Studio 17 2022' -A ARM64 -DTYPEDUCK_ARM64X_MODE=ARM64 "-DTYPEDUCK_ARM64X_INPUTS=$PWD/linker-check/arm.rsp"
          cmake --build linker-check/arm --config Release
          foreach ($mode in 'upper','lower') {
            if ($mode -eq 'lower') {
              (Get-Content cmake/arm64x.cmake -Raw).Replace('/MACHINE:ARM64X','/machine:arm64x') | Set-Content cmake/arm64x.cmake
            }
            cmake -S linker-check -B "linker-check/$mode" -G 'Visual Studio 17 2022' -A ARM64EC -DTYPEDUCK_ARM64X_MODE=ARM64EC "-DTYPEDUCK_ARM64X_INPUTS=$PWD/linker-check/arm.rsp"
            Select-String -Path "linker-check/$mode/MoqiTextService.vcxproj" -Pattern 'TargetMachine|AdditionalOptions'
            cmake --build "linker-check/$mode" --config Release --verbose
            $bytes = [IO.File]::ReadAllBytes("$PWD/linker-check/$mode/Release/MoqiTextService.dll")
            $pe = [BitConverter]::ToInt32($bytes,60)
            Write-Host ('{0} machine: 0x{1:x4}' -f $mode,[BitConverter]::ToUInt16($bytes,$pe+4))
          }
  validate:
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || '41815221383' }}
      ARTIFACT_COMMIT: ${{ inputs.artifact_commit || '72b22f459405251f175a9060ccb1188a3d5d7991' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ARTIFACT_RUN_ID" -Headers @{Authorization="Bearer $env:GH_TOKEN"}
          if ($run.head_sha -ne $env:ARTIFACT_COMMIT) { throw 'Artifact source commit mismatch' }
          New-Item arm-validation -ItemType Directory -Force | Out-Null
          @{artifact_run=$run.html_url; artifact_commit=$run.head_sha; validation_commit=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content arm-validation/provenance.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          path: artifacts
      - name: Test installed ARM64 runtime, upgrade and uninstall
        run: ./scripts/Test-TypeDuckArmInstall.ps1 -Artifacts "$PWD/artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-ARM64-validation
          path: arm-validation/
          if-no-files-found: error
