name: Build compact keyboard compatibility prototype
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile native ARM64 helper
        shell: pwsh
        run: |
          cmake -S KeyboardCompat -B keyboard-compat-build -G 'Visual Studio 17 2022' -A ARM64
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build keyboard-compat-build --config Release
          if ($LASTEXITCODE) { throw 'Build failed' }
          New-Item keyboard-compat-artifact -ItemType Directory -Force | Out-Null
          Copy-Item keyboard-compat-build/Release/*.exe,keyboard-compat-build/Release/*.dll,keyboard-compat-build/Detours-LICENSE.md keyboard-compat-artifact
          @{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content keyboard-compat-artifact/provenance.json
          Get-ChildItem keyboard-compat-artifact -File | Get-FileHash | Select-Object @{n='file';e={Split-Path $_.Path -Leaf}},Hash | ConvertTo-Json | Set-Content keyboard-compat-artifact/hashes.json
      - uses: actions/upload-artifact@v4
        with:
          name: Keyboard-compat-ARM64
          path: keyboard-compat-artifact/
          if-no-files-found: error
  test:
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Keyboard-compat-ARM64
          path: artifact
      - name: Verify native ARM64 mapping isolation and reversible detours
        shell: pwsh
        run: |
          ./artifact/TypeDuckKeyboardCompatTests.exe | Tee-Object test-results.txt
          if ($LASTEXITCODE) { throw 'Native tests failed' }
      - name: Verify watcher startup, single instance and clean exit
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifact/TypeDuckKeyboardCompat.exe).Path
          $watcher = Start-Process $exe -ArgumentList '--watch' -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($watcher.HasExited) { throw 'Watcher exited early' }
            $second = Start-Process $exe -ArgumentList '--watch' -WindowStyle Hidden -PassThru
            if (-not $second.WaitForExit(10000) -or $second.ExitCode -ne 0) { throw 'Single instance check failed' }
            $stop = Start-Process $exe -ArgumentList '--stop' -WindowStyle Hidden -PassThru
            if (-not $stop.WaitForExit(45000) -or $stop.ExitCode -ne 0) { throw 'Watcher stop failed' }
            if (-not $watcher.WaitForExit(10000) -or $watcher.ExitCode -ne 0) { throw 'Watcher did not exit cleanly' }
            'PASS watcher startup, single instance and clean exit' | Add-Content test-results.txt
          } finally {
            if (-not $watcher.HasExited) { Stop-Process -Id $watcher.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Keyboard-compat-test-results
          path: test-results.txt
